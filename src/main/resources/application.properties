# ==============================================================================
# ECOMFLOW ADMIN BACKEND - CONFIGURATION
# ==============================================================================

# Server Settings
server.port=8080
server.servlet.context-path=

# Microsoft SQL Server 2025 Connection Settings
# Configured for ecomflow_db on port 1433 or local instance
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ecomflow_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Ecomflow@2025
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# JSON Serialization (Ignore nulls or formatting if needed)
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Logging Level
logging.level.com.ecomflow.admin=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO

